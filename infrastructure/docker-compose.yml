# Combat Creative OS — local development infrastructure.
#
# Brings up Postgres (application DB + Temporal's own schema), a Temporal
# development server + Web UI, and MinIO (S3-compatible object storage).
# apps/dashboard, apps/api and apps/worker run on the host via `pnpm dev`,
# not as containers here — see README.md.
#
# Usage: from the repository root, `docker compose -f infrastructure/docker-compose.yml up -d`
# (or `cd infrastructure && docker compose up -d`). All variables below have
# inline defaults matching .env.example, so this works whether or not an
# env file is picked up from the invocation directory.

name: combat-creative-os

networks:
  combat-creative-os:
    name: combat-creative-os

volumes:
  postgres-data:
  minio-data:
  qdrant-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-combat_creative_os}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [combat-creative-os]

  temporal:
    image: temporalio/auto-setup:1.24.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - '7233:7233'
    networks: [combat-creative-os]

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - '8080:8080'
    networks: [combat-creative-os]

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [combat-creative-os]

  minio-init:
    image: minio/mc:RELEASE.2024-08-29T01-42-28Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-combat-creative-assets}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      exit 0
      "
    networks: [combat-creative-os]

  # Creative Memory vector search. Stores embedding vectors and filterable
  # payload only — PostgreSQL remains canonical for reference rights,
  # provenance, annotations and processing state, and no reference media,
  # path, URL or credential is ever written here.
  #
  # Bound to 127.0.0.1 so a development instance is not reachable off-host.
  # QDRANT_API_KEY is optional locally and read from the environment; never
  # commit a value for it.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333'
      - '127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334'
    environment:
      # QDRANT__SERVICE__API_KEY is deliberately NOT defaulted here. Qdrant
      # treats an *empty* value as "authentication enabled with an empty key",
      # which makes every data request 401 while /healthz keeps answering — a
      # confusing failure that looks like a client bug. Local development is
      # bound to 127.0.0.1 instead; to enable auth, set a real value in an
      # override file or the shell environment and set QDRANT_API_KEY to match.
      QDRANT__TELEMETRY_DISABLED: 'true'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget; Qdrant ships a `qdrant` binary and a
      # shell, so readiness is probed over the TCP port with bash's /dev/tcp.
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [combat-creative-os]
